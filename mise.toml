# Mise configuration file for lib-common repository.
#
# https://mise.jdx.dev/configuration.html

[tools]
# Python is intentionally absent: the version cannot be expressed statically
# here, since it depends on the system Python. It is resolved by
# configure_tool_manager() in the wscript, which exports MISE_PYTHON_VERSION
# or MISE_DISABLE_TOOLS.
uv = '0.7.2'
rust = '1.92.0'

[settings]
# Only source the virtual environment, never create it: creating it is the
# job of `waf configure`, which knows the interpreter and the packages the
# project needs. Letting mise do it first makes entering the repository
# fail on a fresh clone, since no Python is configured yet.
python.uv_venv_auto = 'source'

[tasks.configure]
alias = "cfg"
description = "Configure the build"
usage = '''
flag "-p --profile <profile>" {
  help "set P environment variable (\"default\" by default)"
  default "default"
}
complete "profile" run="""
awk -F"'" '/profile_[a-z_]+,?$/ {print $2}' build/waftools/backend.py
"""
'''
run = "P=$usage_profile waf configure"

[tasks.configure_fast]
alias = "cf"
description = "Configure for fastest build"
usage = '''
flag "-p --profile <profile>" {
  help "set P environment variable (\"debug\" by default)"
  default "debug"
}
complete "profile" run="""
awk -F"'" '/profile_[a-z_]+,?$/ {print $2}' build/waftools/backend.py
"""
'''
run = "P=$usage_profile waf configure"
[tasks.configure_fast.env]
NO_DOUBLE_FPIC = "1"
NOCHECK = "1"
FAKE_VERSIONS = "1"

[tasks.build]
description = "Build the project"
run = "waf"

[tasks.check]
description = "Run tests"
run = "waf check"

[tasks.clean]
description = "Clean build artifacts"
run = "waf clean"

[tasks.static-checks]
alias = "sc"
description = "Run static checks (ruff, pyrefly)"
run = "./static-checks.py"

[tasks.target]
alias = "t"
description = "Build specific target(s)"
usage = '''
arg "<target>"
complete "target" run="waf list 2>/dev/null | grep -v -E \"^(Waf:|'list')\""
'''
run = "waf build --targets=${usage_target}"
