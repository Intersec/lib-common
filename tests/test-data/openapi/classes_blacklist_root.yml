openapi: 3.0.2
info:
  title: structs
  version: 2.3.1
servers:
  - url: /
paths: {}
components:
  schemas:
    tstiop.StructJpackFlags:
      type: object
      properties:
        opt:
          type: integer
          format: int32
        def:
          type: integer
          format: int32
          default: 1
        rep:
          type: array
          items:
            type: integer
            format: int32
    tstiop.MyStructB:
      type: object
      properties:
        a:
          type: integer
          format: int32
        b:
          type: array
          items:
            type: integer
            format: int32
    tstiop.MyUnionA:
      oneOf:
        - type: object
          required:
            - ua
          properties:
            ua:
              type: integer
              format: int32
        - type: object
          required:
            - ub
          properties:
            ub:
              type: integer
              format: int32
              minimum: -128
              maximum: 127
        - type: object
          required:
            - us
          properties:
            us:
              type: string
    tstiop.MyStructF:
      type: object
      properties:
        a:
          type: array
          items:
            type: string
        b:
          type: array
          items:
            type: string
            format: byte
        c:
          type: array
          items:
            $ref: "#/components/schemas/tstiop.MyStructB"
        d:
          type: array
          items:
            $ref: "#/components/schemas/tstiop.MyUnionA"
